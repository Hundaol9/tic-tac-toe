<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC TOE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Leckerli+One&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Glitch+Pop&family=Story+Script&display=swap" rel="stylesheet">
    

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Leckerli+One&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oxanium:wght@200..800&family=Rubik+Glitch+Pop&family=Story+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
    
</head>
<body>


<header class="top-bar">
    <h1>Tic Tac Toe</h1>
    <p>A little game between friends</p>
     <button type="button" id="menu-button" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="timer-container">
        <span class="timer-icon">◷</span>
        <p id="game-timer">00:00</p>
    </div>
    </header>


<main>
    <section id="game-mode">
        <h2>Choose Game Mode</h2>
        <label for="mode">Select Game Mode:</label>
        <select id="mode">
            <option value="two-player">Two Players</option>
            <option value="computer">Play Against Computer</option>
        </select>
  
    </section>

    <section id="player-setup">
    <h2>Meet the Players</h2>
    <div class="player-input">
        <label for="player-x">Player X:</label>
        <input type="text" id="player-x" placeholder="Enter Player X's name">

        <label for="player-o">Player O:</label>
        <input type="text" id="player-o" placeholder="Enter Player O's name">
</div>
    </section>



    <section id="game-arena">
         <div id="players-column">
    <div id="player-x-side" class="side-panel">
    
            <div class="player-label">
                <span class="turn-indicator">▷</span>
                <h2 id="player-x-name">Player X</h2>
            </div>

            <div class="player-symbol">X</div>
            <p class="side-score">
                Score: <span id="player-x-score">0</span>
            </p>
        </div>
   

    <div id="player-o-side" class="side-panel">
    
            <div class="player-label">
                <span class="turn-indicator">▷</span>
                <h2 id="player-o-name">Player O</h2>
            </div>

            <div class="player-symbol">O</div>
            <p class="side-score">
                Score: <span id="player-o-score">0</span>
            </p>
        </div>
        
    
    </div>



 <section id="game-section">
        <button type="button" id="play-button">Let's play</button>
        <p id="game-status" aria-live="polite">
            Player X's turn</p>

<div id="game-board"  aria-label="Tic Tac Toe Board">
    <button type="button" class="cell" data-cell-index="1" aria-label="Cell 1"></button>    
    <button type="button" class="cell" data-cell-index="2" aria-label="Cell 2"></button>
    <button type="button" class="cell" data-cell-index="3" aria-label="Cell 3"></button>
    <button type="button" class="cell" data-cell-index="4" aria-label="Cell 4"></button>
    <button type="button" class="cell" data-cell-index="5" aria-label="Cell 5"></button>
    <button type="button" class="cell" data-cell-index="6" aria-label="Cell 6"></button>
    <button type="button" class="cell" data-cell-index="7" aria-label="Cell 7"></button>
    <button type="button" class="cell" data-cell-index="8" aria-label="Cell 8"></button>
    <button type="button" class="cell" data-cell-index="9" aria-label="Cell 9"></button>
</div>
<div id="game-controls">

    <button type="button" id="restart-button" aria-label="Another round">
    ↻
</button>

    <button type="button" id="home-button" aria-label="Go to home">
        ⌂
    </button>

</div>

</section>

<section class="game-life">   
<div id="stage-section">
     <h2>
        Stage: <span id="stage-number">1</span>/3
      </h2>

      <div id="lives-container" aria-label="Three lives remaining">
        <span class="heart">♡</span> x3
      </div>

</div>

</section>
    </section>

<section id="result-section">
    <h2 id="result-title">Player X Wins!</h2>
    <p id="result-message">
        Congratulations!
    </p>
</section>








</main>
 <footer>
        <p>Made with creativity and a little competition.</p>
    </footer>
</body>
</html>
